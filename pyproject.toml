[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-cli-manager"
version = "2.1.0"
description = "Manager-oriented command line client and MCP server for Jira Software Server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "shawnbhs" }]
keywords = ["jira", "cli", "mcp", "agile", "reporting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.32",
    "mcp>=1.29,<2",
    "PyYAML>=6",
]

[project.optional-dependencies]
# Ranged, not open: a new major/minor of a linter or test runner can change
# the CI verdict on unchanged code. Raise the ranges deliberately.
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
    "bandit>=1.9,<2",
    "pip-audit>=2.10,<3",
]

[project.scripts]
jira = "jira_cli.cli.main:main"
jira-cli = "jira_cli.cli.main:main"
jira-mcp = "jira_cli.mcp_server:main"

[tool.setuptools.packages.find]
include = ["jira_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test file
"tests/*" = ["S101"]
