name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token: a compromised step cannot write to the repository.
permissions:
  contents: read

jobs:
  test:
    name: lint and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A hung step (network stall in pip, a test waiting on input) fails the
    # job instead of holding a runner for the 6-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: a shallow checkout would make any history-wide check
          # report clean on a repository whose problem is three commits back.
          fetch-depth: 0
          # Do not leave GITHUB_TOKEN in .git/config while `pip install`
          # runs third-party build code; no later step needs git auth.
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          # The runner image ships an old setuptools that pip-audit flags;
          # it is a build tool of the runner, not a dependency of this package.
          python -m pip install --upgrade pip setuptools
          pip install -e .[dev]

      # Linter configuration lives in pyproject.toml, not in these flags, so a
      # contributor running `ruff check .` locally gets the same verdict.
      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest -q

      - name: bandit
        run: bandit -r jira_cli -ll

      # The package's runtime dependency closure exactly as installed for this
      # Python version (dev extra excluded): what a user on this interpreter
      # gets. Runs on every matrix entry, without re-resolving anything.
      - name: pip-audit (package dependencies)
        run: |
          python - > "$RUNNER_TEMP/package-deps.txt" <<'PY'
          import re
          from importlib.metadata import distribution
          from packaging.requirements import Requirement

          def key(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          root = "jira-cli-manager"
          pinned, todo = {}, [(root, ())]
          while todo:
              name, extras = todo.pop()
              dist = distribution(name)
              seen = pinned.setdefault(key(name), [dist.version, set()])
              new = set(extras) - seen[1]
              if seen[1] and not new:
                  continue
              seen[1] |= new | {""}
              for raw in dist.requires or []:
                  req = Requirement(raw)
                  wanted = [""] + sorted(new)
                  if req.marker is None or any(req.marker.evaluate({"extra": e}) for e in wanted):
                      todo.append((req.name, tuple(req.extras)))
          for name, (version, _) in sorted(pinned.items()):
              if name != root:
                  print(f"{name}=={version}")
          PY
          cat "$RUNNER_TEMP/package-deps.txt"
          pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/package-deps.txt"

      # The whole job environment, including the dev tools. Newest Python only:
      # pip-audit itself pulls filelock (via CacheControl), and every fixed
      # filelock release requires Python >= 3.11, so on 3.10 this audit fails
      # on a tool dependency the package never ships. Keep this equal to the
      # last entry of the matrix above.
      - name: pip-audit (job environment)
        if: matrix.python-version == '3.12'
        run: pip-audit

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned release binary verified against the published sha256 instead of
      # a third-party action: no token is handed to external code, and a
      # tampered download fails the job before it ever runs.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" "$base/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: gitleaks (full history, redacted)
        run: gitleaks git . --redact --verbose --exit-code 1
